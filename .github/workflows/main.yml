name: Node.js Package
on: [push, pull_request]

jobs:
  test:
    name: Test example code
    runs-on: ubuntu-latest
    env:
      DCV_LICENSE: ${{ secrets.dcv_license }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/
      - name: install
        run: npm install
      - name: smoke test
        run: node test.js
      - name: decode test
        if: env.DCV_LICENSE != ''
        run: node test.js examples/command-line/test.tif

  publish:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org/

      # Fails fast with a readable message when the token is missing or expired,
      # instead of the cryptic `E404 Not Found - PUT` npm returns later on.
      - name: Verify npm credentials
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token || secrets.NPM_TOKEN }}
        run: |
          npm whoami
          npm view "$(node -p "require('./package.json').name")" name

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.npm_token || secrets.NPM_TOKEN }}
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already published, nothing to do."
            exit 0
          fi
          npm publish --access public
